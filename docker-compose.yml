services:
  db:
    image: postgres:18
    container_name: freelancerflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelancerflow
      POSTGRES_USER: freelancerflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  backend:
    build:
      context: ./backend
    container_name: freelancerflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media

  frontend:
    build:
      context: ./frontend
    container_name: freelancerflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
